<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Une lettre pour toi 💌</title>
  <style>
    body { font-family: Georgia, serif; background: #fff5f5; display: flex; justify-content: center; padding: 40px 20px; }
    .lettre { background: white; max-width: 600px; width: 100%; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h2 { color: #c0392b; margin-bottom: 10px; }
    .message { font-size: 1.1em; line-height: 1.8; color: #333; margin: 30px 0; white-space: pre-wrap; }
    .signature { color: #888; font-style: italic; }
    .partage { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; text-align: center; }
    .partage p { color: #888; margin-bottom: 15px; }
    .btn { display: inline-block; margin: 5px; padding: 12px 20px; border-radius: 8px; text-decoration: none; color: white; font-family: Arial, sans-serif; font-size: 0.95em; }
    .btn-wa { background: #25D366; }
    .btn-sms { background: #555; }
    .btn-copy { background: #c0392b; cursor: pointer; border: none; }
  </style>
</head>
<body>
  <div class="lettre">
    <h2 id="destinataire">Chargement...</h2>
    <div class="message" id="message"></div>
    <div class="signature" id="expediteur"></div>

    <div class="partage" id="partage" style="display:none">
      <p>📲 Envoie ce lien à ton ami :</p>
      <a id="btn-wa" class="btn btn-wa" target="_blank">WhatsApp</a>
      <a id="btn-sms" class="btn btn-sms">SMS</a>
      <button class="btn btn-copy" onclick="copierLien()">Copier le lien</button>
      <p id="copie-msg" style="color:green;display:none">✅ Lien copié !</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://fjcflemqasbdctihxedk.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqY2ZsZW1xYXNiZGN0aWh4ZWRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NTMyODEsImV4cCI6MjA5NjUyOTI4MX0.phIVXZRgyJGorheBpdUgVn1NOnexOv71jNZCZTSUv6s";

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const lien = window.location.href;

    if (id) {
      fetch(`${SUPABASE_URL}/rest/v1/lettres?id=eq.${id}&select=*`, {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      })
      .then(r => r.json())
      .then(data => {
        if (data && data.length > 0) {
          const l = data[0];
          document.getElementById("destinataire").textContent = "Pour " + l.destinataire + " 💌";
          document.getElementById("message").textContent = l.message;
          document.getElementById("expediteur").textContent = "— " + l.expediteur;

          const texte = encodeURIComponent("J'ai écrit une lettre pour toi 💌 : " + lien);
          document.getElementById("btn-wa").href = "https://wa.me/?text=" + texte;
          document.getElementById("btn-sms").href = "sms:?body=" + texte;
          document.getElementById("partage").style.display = "block";
        } else {
          document.getElementById("destinataire").textContent = "Lettre introuvable 😕";
        }
      });
    }

    function copierLien() {
      navigator.clipboard.writeText(lien).then(() => {
        document.getElementById("copie-msg").style.display = "block";
      });
    }
  </script>
</body>
</html>
